name: 构建安卓 APK（原生 Kotlin）

on:
  workflow_dispatch:
  push:
    paths: [ "android/**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v             -keystore photobox.jks -keyalg RSA -keysize 2048 -validity 10000             -alias photobox -storepass photobox -keypass photobox             -dname "CN=PhotoBox, OU=App, O=PhotoBox, L=HZ, ST=ZJ, C=CN"
          ls -lh photobox.jks

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Release APK
        id: gradle
        continue-on-error: true
        working-directory: android
        env:
          PB_KEYSTORE: ${{ github.workspace }}/photobox.jks
          PB_STORE_PASS: photobox
          PB_ALIAS: photobox
          PB_KEY_PASS: photobox
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log; echo "EXIT=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 收集 APK
        id: collect
        run: |
          mkdir -p dist
          # 只取本次构建产物，排除仓库里已提交的旧 apk 目录
          find android/app/build/outputs -name "*.apk" -type f -exec cp -v {} dist/ \; || true
          ls -lh dist/
          echo "=== APK 指纹 ==="
          for f in dist/*.apk; do echo "$f"; sha256sum "$f"; done
          /usr/local/lib/android/sdk/build-tools/*/aapt2 dump badging dist/*.apk 2>/dev/null | head -3 || true
          echo "COUNT=$(ls dist/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: 回写日志
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          tok=os.environ["GH_TOKEN"]; repo=os.environ["GITHUB_REPOSITORY"]
          try: raw=open("build.log","rb").read()
          except OSError: raw=b"no log"
          if len(raw)>600_000: raw=raw[:200_000]+b"\n...truncated...\n"+raw[-400_000:]
          body={"message":"android build log","content":base64.b64encode(raw).decode()}
          try:
              r=urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/android-build-log.txt",
                  headers={"Authorization":f"token {tok}","User-Agent":"gh"})
              body["sha"]=json.loads(urllib.request.urlopen(r,timeout=60).read())["sha"]
          except Exception: pass
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/android-build-log.txt",
              data=json.dumps(body).encode(),method="PUT",
              headers={"Authorization":f"token {tok}","Accept":"application/vnd.github+json",
                       "Content-Type":"application/json","User-Agent":"gh"})
          try: print("回写:",urllib.request.urlopen(req,timeout=120).status)
          except Exception as e: print("回写失败:",e)
          PY

      - name: 上传产物
        if: steps.collect.outputs.COUNT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: 光影相册-安卓APK
          path: dist/*.apk
          retention-days: 30

      - name: 发布 Release
        if: steps.collect.outputs.COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "光影相册 安卓版 $TAG" \
            --notes "原生 Kotlin 安卓版，直接下载安装即可。"

      - name: 提交 APK 到仓库 apk 目录
        if: steps.collect.outputs.COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, glob, json, os, urllib.request
          tok=os.environ["GH_TOKEN"]; repo=os.environ["GITHUB_REPOSITORY"]
          import hashlib
          for path in sorted(glob.glob("dist/*.apk")):
              raw=open(path,"rb").read(); name=os.path.basename(path)
              print(f"{name}: {len(raw)//1024} KB sha256={hashlib.sha256(raw).hexdigest()[:16]}")
              target=f"apk/{name}"
              # 先删除旧文件，确保 PUT 一定是新建，避免 sha 冲突导致静默失败
              try:
                  r=urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/{target}",
                      headers={"Authorization":f"token {tok}","User-Agent":"gh"})
                  old=json.loads(urllib.request.urlopen(r,timeout=60).read())
                  if old.get("sha"):
                      dr=urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/{target}",
                          data=json.dumps({"message":f"remove old {name}","sha":old["sha"]}).encode(),
                          method="DELETE",
                          headers={"Authorization":f"token {tok}","Accept":"application/vnd.github+json",
                                   "Content-Type":"application/json","User-Agent":"gh"})
                      print("  删除旧文件:", urllib.request.urlopen(dr,timeout=120).status)
              except Exception as e:
                  print("  无旧文件:", e)
              body={"message":f"chore: {name}","content":base64.b64encode(raw).decode()}
              req=urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/{target}",
                  data=json.dumps(body).encode(),method="PUT",
                  headers={"Authorization":f"token {tok}","Accept":"application/vnd.github+json",
                           "Content-Type":"application/json","User-Agent":"gh"})
              try: print("  结果:",urllib.request.urlopen(req,timeout=600).status)
              except Exception as e: print("  失败:",e)
          PY

      - name: 失败则中断
        if: steps.collect.outputs.COUNT == '0'
        run: |
          echo "::error::未产出 APK"
          exit 1
