name: 构建 Android APK

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: write      # 允许回写构建日志，便于远程排错

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 构建 APK
        id: build
        continue-on-error: true
        run: |
          flet build apk --yes \
            --project photobox \
            --product "光影相册" \
            --org "cn.photobox" \
            --bundle-id "cn.photobox.app" \
            --description "本地照片管理与清理工具" \
            --build-version "1.0.0" \
            --permissions photo_library \
            --android-permissions \
                android.permission.READ_MEDIA_IMAGES=true \
                android.permission.READ_MEDIA_VIDEO=true \
                android.permission.READ_MEDIA_VISUAL_USER_SELECTED=true \
                android.permission.READ_EXTERNAL_STORAGE=true \
                android.permission.INTERNET=true \
            --android-legacy-packaging \
            -o build > build.log 2>&1
          echo "EXIT=$?" >> "$GITHUB_OUTPUT"
          echo "----- 日志尾部 -----"
          tail -60 build.log

      - name: 回写构建日志到仓库
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          tok = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          try:
              raw = open("build.log", "rb").read()
          except OSError:
              raw = b"no build.log"
          if len(raw) > 600_000:
              raw = raw[:200_000] + b"\n...[truncated]...\n" + raw[-400_000:]
          body = {"message": "build log", "content": base64.b64encode(raw).decode()}
          # 已存在则带 sha 覆盖
          try:
              r = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/build-log.txt",
                  headers={"Authorization": f"token {tok}", "User-Agent": "gh"})
              d = json.loads(urllib.request.urlopen(r, timeout=60).read())
              body["sha"] = d["sha"]
          except Exception:
              pass
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/build-log.txt",
              data=json.dumps(body).encode(), method="PUT",
              headers={"Authorization": f"token {tok}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json",
                       "User-Agent": "gh"})
          try:
              print("回写:", urllib.request.urlopen(req, timeout=120).status)
          except Exception as e:
              print("回写失败:", e)
          PY

      - name: 上传 APK 产物
        if: steps.build.outputs.EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: 光影相册-APK
          path: build/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 失败则中断
        if: steps.build.outputs.EXIT != '0'
        run: |
          echo "::error::APK 构建失败"
          exit 1
