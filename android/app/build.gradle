plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cn.photobox.app'
    compileSdk 34

    defaultConfig {
        applicationId "cn.photobox.app"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6.0"
        resourceConfigurations += ["zh"]
    }

    signingConfigs {
        create("release") {
            def ks = System.getenv("PB_KEYSTORE") ?: "photobox.jks"
            storeFile = file(ks)
            storePassword = System.getenv("PB_STORE_PASS") ?: "photobox"
            keyAlias = System.getenv("PB_ALIAS") ?: "photobox"
            keyPassword = System.getenv("PB_KEY_PASS") ?: "photobox"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            // 有密钥库就签名，保证产出的 APK 可直接安装
            if (file(System.getenv("PB_KEYSTORE") ?: "photobox.jks").exists()) {
                signingConfig signingConfigs.getByName("release")
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packagingOptions { resources { excludes += '/META-INF/*' } }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "com.google.android.material:material:1.11.0"
}
